<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MashadArabic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Üst şerit (HUD): logo ve kullanıcı -->
  <header class="hud">
    <div class="hud-ic ">
      <a href="./" class="hud-logo"><h1>Mashad<span>Arabic</span></h1></a>
      <a href="profil.html" class="profil-cip" id="profilCip" title="Profilim">
        <span class="profil-cip-avatar" id="cipAvatar"></span>
        <span class="profil-cip-metin">
          <b id="cipAd">Misafir</b>
          <small><span data-ikon="yildiz"></span> <span id="cipPuan">0</span> puan</small>
        </span>
        <i class="artis" id="artis"></i>
      </a>
    </div>
  </header>

  <main class="sahne">

    <div class="video-alan">
      <div class="oynatici-kutu">
        <div id="oynatici"></div>
        <!-- Videoya tıklanmasını ve YouTube menülerini engeller -->
        <div class="kalkan"></div>
        <!-- Başlangıçta ve yeni video yüklenirken YouTube ekranını gizleyen perde -->
        <div class="perde" id="perde">
          <button id="basla" class="basla" disabled>Yükleniyor…</button>
        </div>
        <button id="tekrar" class="tekrar" title="Tekrar dinle (R)" hidden>↻</button>
      </div>

      <!-- Altyazı, şıklar ve oklar videonun alt kısmının üstünde durur -->
      <div class="katman">
        <p class="altyazi" dir="rtl" lang="ar" id="altyazi" hidden></p>

        <div class="secenekler bekliyor" id="secenekler" hidden>
          <button class="secenek" data-i="0"><kbd>1</kbd><span></span></button>
          <button class="secenek" data-i="1"><kbd>2</kbd><span></span></button>
        </div>

        <nav class="gecis bekliyor" id="gecis" hidden>
          <button id="onceki" class="ok" title="Önceki klip (←)">← Önceki</button>
          <button id="sonraki" class="ok ana" title="Sonraki klip (→ veya Enter)">Sonraki →</button>
        </nav>
      </div>
    </div>

    <!-- Oyun çubuğu: altyazı modu, klip sırası ve seri -->
    <div class="oyun-cubugu">
      <div class="mod" role="group" aria-label="Altyazı">
        <button id="modAltyazili" class="mod-btn">Altyazılı</button>
        <button id="modAltyazisiz" class="mod-btn">Altyazısız</button>
      </div>
      <div class="cubuk-sag">
        <span class="sayac" id="sayac"></span>
        <span class="rozet" id="seriRozet" title="Üst üste doğru cevap"><span data-ikon="alev"></span> <b id="seri">0</b> <small id="enIyi"></small></span>
      </div>
    </div>

    <p class="hata" id="hata" hidden></p>
  </main>

  <script src="data.js"></script>
  <script src="ikonlar.js"></script>
  <script src="profil.js"></script>
  <script src="app.js"></script>
  <script type="module" src="hesap.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
